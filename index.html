<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 형광골렘 어려워 </title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 20px;
            gap: 20px;
        }

        .video-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .guide-video {
            width: 100%;
            max-width: 320px;
            height: auto;
            max-height: 200px;
            object-fit: contain;
            border-radius: 8px;
            border: 2px solid #333;
            background-color: #000;
        }

        .center-box {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        h1 { 
            margin: 0 0 15px 0; 
            font-size: 22px; 
            white-space: nowrap;
        }
        .info-panel {
            background-color: #2a2a2a;
            padding: 15px 20px;
            border-radius: 8px;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .control-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:disabled {
            background-color: #555555;
            cursor: not-allowed;
        }
        .btn:hover:not(:disabled) { background-color: #45a049; }

        .contact-box {
            flex: 1;
            background-color: #2a2a2a;
            padding: 15px 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #333;
        }
        .contact-box h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #ddd;
        }
        .contact-box p {
            margin: 5px 0;
            font-size: 14px;
            color: #bbb;
        }

        .status-text {
            margin-top: 10px;
            margin-bottom: 10px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }
        .canvas-container {
            position: relative;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
            margin-bottom: 25px;
        }
        video#webcamVideo { display: none; }
        canvas { display: block; max-width: 100%; height: auto; }

        .privacy-notice {
            font-size: 13px;
            color: #888;
            text-align: center;
            padding: 10px 20px;
            background-color: #222;
            border-radius: 6px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="top-container">
        <div class="video-box">
            <video class="guide-video" controls preload="metadata">
                <source src="G.mp4" type="video/mp4">
                브라우저가 동영상 재생을 지원하지 않습니다.
            </video>
        </div>

        <div class="center-box">
            <h1>형광골렘 어려워</h1>
            <div class="info-panel">
                <p style="margin: 0 0 10px 0; font-size: 14px;">
                   <b>1. 화면 공유 2. 마인크래프트 창 선택 3. 제련하기 후 빈 모루를 사이트에서 드래그후 제련해주세요.</b>
                </p>
                
                <div class="control-row">
                    <button id="startBtn" class="btn" disabled>엔진 로딩 중</button>
                    <label style="font-weight: bold; cursor: pointer; user-select: none;">
                        <input type="checkbox" id="pipToggle" style="transform: scale(1.2); vertical-align: middle; cursor: pointer;">
                        <span style="vertical-align: middle; margin-left: 4px;">PIP 모드</span>
                    </label>
                </div>

                <div class="control-row" style="margin-top: 12px;">
                    <label style="font-weight: bold; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 8px;">
                        <span>순서크기:</span>
                        <input type="range" id="pxSlider" min="8" max="30" value="12" style="cursor: pointer; width: 100px;">
                        <span id="pxValueText" style="min-width: 35px; text-align: left;">12px</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="contact-box">
            <h3>버그제보, 문의</h3>
            <p>인게임 : <b>인형</b></p>
            <p>디스코드 : <b>white.109</b></p>
        </div>
    </div>

    <video id="pipVideo" autoplay muted playsinline style="display: none;"></video>

    <div class="status-text" id="status">OpenCV.js 연산 엔진을 초기화하는 중입니다</div>

    <div class="canvas-container">
        <video id="webcamVideo" autoplay playsinline></video>
        <canvas id="outputCanvas"></canvas>
    </div>

    <div class="privacy-notice">
        해당 사이트는 유저의 화면 또는 접속기록 등 어떠한 개인정보도 서버에 저장하지 않습니다.
    </div>
    <script src="app.js"></script>
    <script>
        var Module = {
            onRuntimeInitialized: function() {
                if (typeof onOpenCvReady === 'function') {
                    onOpenCvReady();
                }
            }
        };
    </script>
    <script async src="https://docs.opencv.org/4.7.0/opencv.js"></script>
</body>
</html>
