<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>순간기억 뼈때리는 형광골렘 혼내주기</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 10px; font-size: 24px; }
        .info-panel {
            background-color: #2a2a2a;
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            margin: 5px;
        }
        .btn:hover { background-color: #45a049; }
        .btn-reset { background-color: #f44336; }
        .btn-reset:hover { background-color: #da190b; }

        .canvas-container {
            position: relative;
            margin-top: 10px;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
        }
        video { display: none; }
        canvas { display: block; max-width: 100%; height: auto; }
        
        .status-text {
            margin-top: 8px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
    <!-- OpenCV.js 실시간 템플릿 매칭 엔진 로드 -->
    <script async src="https://docs.opencv.org/4.7.0/opencv.js" onload="onOpenCvReady();"></script>
</head>
<body>

    <h1>순간기억 뼈때리는 형광골렘 혼내주기</h1>
    
    <div class="info-panel">
        <p style="margin: 0 0 10px 0;">순서: <b>1. 화면 공유 ➔ 2. 마인크래프트 창 선택 ➔ 3. 제련후 따라하기</b></p>
        <button id="startBtn" class="btn" disabled>엔진 로딩 중</button>
        <button id="resetBtn" class="btn btn-reset">초기화 (Space / R)</button>
    </div>

    <div class="status-text" id="status">OpenCV.js 비전 라이브러리를 불러오는 중</div>

    <div class="canvas-container">
        <video id="webcamVideo" autoplay playsinline></video>
        <canvas id="outputCanvas"></canvas>
    </div>

    <script src="app.js"></script>
</body>
</html>
